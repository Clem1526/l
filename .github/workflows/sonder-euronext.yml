name: Recuperer les donnees Euronext

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sonder_euronext.sh"
      - ".github/workflows/sonder-euronext.yml"

permissions:
  contents: write

jobs:
  euronext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sonder_euronext.sh
      - name: Committer les CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add donnees/euronext_2025/
          git diff --cached --quiet || git commit -m "Donnees : export CSV Euronext 2025 des 5 actions"
          git push
