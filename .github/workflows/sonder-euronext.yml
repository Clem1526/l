name: Sonder Euronext

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sonder_euronext.sh"
      - ".github/workflows/sonder-euronext.yml"

jobs:
  sonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sonder_euronext.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sonde-euronext
          path: sonde/
